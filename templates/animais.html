<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Gerenciar Animais</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
    <header><h1>🐾 Gerenciar Animais</h1><nav><a href="{{ url_for('cadastrar_animal') }}">Adicionar Animal</a><a href="{{ url_for('index') }}">Voltar</a></nav></header>
    <div class="container" style="max-width: 1000px;">
        <h2>Lista de Pets</h2>
        <table>
            <tr><th>Nome</th><th>Espécie</th><th>Raça</th><th>Categoria</th><th>Tutor</th><th>Ações</th></tr>
            {% for a in animais %}
            <tr>
                <td><strong>{{ a.nome_pet }}</strong></td>
                <td>{{ a.especie }}</td>
                <td>{{ a.raca }}</td>
                <td><span style="background: #e8f5e9; color: #2e7d32; padding: 3px 8px; border-radius: 4px; font-weight: 600;">{{ a.categoria }}</span></td>
                <td>{{ a.nome_tutor }}</td>
                <td>
                    <a href="{{ url_for('editar_animal', id=a.id) }}" style="background: #ffa726; color: white; padding: 5px 8px; text-decoration: none; border-radius: 4px; font-size: 0.85rem;">Editar</a>
                    <a href="{{ url_for('deletar_animal', id=a.id) }}" onclick="return confirm('Tem certeza?');" style="background: #e53935; color: white; padding: 5px 8px; text-decoration: none; border-radius: 4px; font-size: 0.85rem;">Retirar</a>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="6">Nenhum animal cadastrado.</td></tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
