<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Adicionar Animal</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
    <header><h1>🐾 Adicionar Animal</h1><nav><a href="{{ url_for('listar_animais') }}">Voltar</a></nav></header>
    <div class="container">
        <h2>Cadastrar Novo Pet</h2>
        <form method="POST">
            <label>Nome do Pet:</label><input type="text" name="nome_pet" required>
            <label>Espécie:</label><input type="text" name="especie" required>
            <label>Raça:</label><input type="text" name="raca" required>
            <label>Categoria:</label>
            <select name="categoria" required>
                <option value="Terrestre">Terrestre</option>
                <option value="Aéreo">Aéreo</option>
                <option value="Aquático">Aquático</option>
                <option value="Anfíbio">Anfíbio</option>
                <option value="Outro">Outro</option>
            </select>
            <label>Tutor Responsável:</label>
            <select name="id_tutor" required>
                <option value="">Selecione...</option>
                {% for t in tutores %}
                <option value="{{ t.id }}">{{ t.nome }}</option>
                {% endfor %}
            </select>
            <button type="submit">Salvar Animal</button>
        </form>
    </div>
</body>
</html>
