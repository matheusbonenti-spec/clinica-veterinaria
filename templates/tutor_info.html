<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Gerenciar Tutores</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
    <header><h1>🐾 Gerenciar Tutores</h1><nav><a href="{{ url_for('cadastrar_tutor') }}">Adicionar Tutor</a><a href="{{ url_for('index') }}">Voltar</a></nav></header>
    <div class="container" style="max-width: 1000px;">
        <form method="GET" style="flex-direction: row;">
            <input type="text" name="busca" placeholder="Pesquisar por nome ou telefone..." value="{{ busca }}" style="flex: 1;">
            <button type="submit">Pesquisar</button>
        </form>
        <table>
            <tr><th>Nome</th><th>Telefone</th><th>Endereço</th><th>Ações</th></tr>
            {% for t in tutores %}
            <tr>
                <td>{{ t.nome }}</td>
                <td>{{ t.telefone }}</td>
                <td>{{ t.endereco }}</td>
                <td>
                    <a href="{{ url_for('editar_tutor', id=t.id) }}" style="background: #ffa726; color: white; padding: 5px 8px; text-decoration: none; border-radius: 4px; font-size: 0.85rem;">Editar</a>
                    <a href="{{ url_for('deletar_tutor', id=t.id) }}" onclick="return confirm('Tem certeza?');" style="background: #e53935; color: white; padding: 5px 8px; text-decoration: none; border-radius: 4px; font-size: 0.85rem;">Retirar</a>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="4">Nenhum tutor encontrado.</td></tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
