<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Adicionar Tutor</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
    <header><h1>🐾 Adicionar Tutor</h1><nav><a href="{{ url_for('listar_tutores') }}">Voltar</a></nav></header>
    <div class="container">
        <h2>Cadastrar Novo Tutor</h2>
        <form method="POST">
            <label>Nome:</label><input type="text" name="nome" required>
            <label>CPF:</label><input type="text" name="cpf" required>
            <label>Telefone:</label><input type="text" name="telefone" required>
            <label>Endereço:</label><input type="text" name="endereco" required>
            <button type="submit">Salvar Tutor</button>
        </form>
    </div>
</body>
</html>
